[package]
name = "takuzu-gen"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1.10"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true